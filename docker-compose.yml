services:
  llama:
    image: ronxldwilson/json-repair:llama
    build:
      context: .
      dockerfile: Dockerfile.llama
    platform: linux/amd64
    command: ["--model", "/models/qwen2.5-coder-1.5b-instruct-q5_k_m.gguf", "--host", "0.0.0.0", "--port", "8776", "-t", "3", "-c", "8192", "--temp", "0", "-np", "8", "--flash-attn", "on"]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8776/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  api:
    image: ronxldwilson/json-repair:api
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - LLAMA_HOST=llama
      - LLAMA_PORT=8776
      # To use an external LLM API (Groq, OpenAI, etc.) instead of local llama:
      # - LLM_PROVIDER=external
      # - EXTERNAL_API_URL=https://api.groq.com/openai/v1
      # - EXTERNAL_API_KEY=gsk_...
      # - EXTERNAL_MODEL=llama-3.3-70b-versatile
    depends_on:
      llama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
